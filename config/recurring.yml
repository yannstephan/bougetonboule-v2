# Tâches récurrentes (Solid Queue), superviseur dans Puma via SOLID_QUEUE_IN_PUMA=true.
# L'import Strava est TEMPS RÉEL via webhooks ; ce job n'est qu'un filet de sécurité.
production:
  strava_reconcile:
    class: StravaSyncJob
    schedule: every day at 4am
  # Récompense du 1er du classement mensuel, le 1er de chaque mois (juge le mois écoulé).
  league_monthly_reward:
    class: LeagueMonthlyRewardJob
    schedule: "20 4 1 * *"
  # Jauge de meute : le lundi matin, juge la semaine écoulée (≥5 coéquipiers × ≥10 km → +10 %).
  pack_level:
    class: PackLevelJob
    schedule: every monday at 4:40am
  # Streak hebdo : le lundi matin, juge la semaine écoulée (course → 💎, sinon joker/reset).
  weekly_streak:
    class: WeeklyStreakJob
    schedule: every monday at 4:50am
  # Monstre affamé (72h sans course → −50 PV/jour) + clôture de la partie à sa date de fin.
  famine_and_season_end:
    class: FamineJob
    schedule: every day at 5am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

# Tâches récurrentes (Solid Queue). En prod, le superviseur tourne dans Puma
# via SOLID_QUEUE_IN_PUMA=true — aucun scheduler externe payant nécessaire.
production:
  strava_sync:
    class: StravaSyncJob
    schedule: every hour
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

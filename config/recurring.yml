# Tâches récurrentes (Solid Queue), superviseur dans Puma via SOLID_QUEUE_IN_PUMA=true.
# L'import Strava est TEMPS RÉEL via webhooks ; ce job n'est qu'un filet de sécurité.
production:
  strava_reconcile:
    class: StravaSyncJob
    schedule: every day at 4am
  # Clôture de la semaine de ligue : promotions / relégations, tous les lundis matin.
  league_weekly_reset:
    class: LeagueWeeklyResetJob
    schedule: every monday at 4:10am
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
